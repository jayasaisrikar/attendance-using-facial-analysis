{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Trigger Attendance Alert</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Branch</label>
                            <input type="text" name="branch" class="form-control" required>
                        </div>
                        <!-- Year field commented out -->
                        <!-- <div class="mb-3">
                            <label class="form-label">Year</label>
                            <input type="number" name="year" class="form-control" required>
                        </div> -->
                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <select name="course" class="form-select" required>
                                <option value="BTech">BTech</option>
                                <option value="MCA">MCA</option>
                                <option value="MTech">MTech</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Semester</label>
                            <select name="semester" class="form-select" required>
                                <!-- Semester options will be updated dynamically based on selected course -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Duration (minutes)</label>
                            <input type="number" name="duration" class="form-control" value="5" min="1" max="60" required>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-bell me-2"></i>Trigger Alert
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const courseSelect = document.querySelector("select[name='course']");
    const semesterSelect = document.querySelector("select[name='semester']");

    function updateSemesters() {
        const course = courseSelect.value;
        semesterSelect.innerHTML = "";
        let semesters = [];
        
        if (course === "BTech") {
            semesters = ["1-1", "1-2", "2-1", "2-2", "3-1", "3-2", "4-1", "4-2"];
        } else if (course === "MCA" || course === "MTech") {
            semesters = ["1-1", "1-2", "2-1", "2-2"];
        }
        
        semesters.forEach(sem => {
            const option = document.createElement("option");
            option.value = sem;
            option.textContent = sem;
            semesterSelect.appendChild(option);
        });
    }
    
    courseSelect.addEventListener("change", updateSemesters);
    updateSemesters();
});
</script>

{% endblock %}
