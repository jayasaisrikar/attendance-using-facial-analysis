{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Take Attendance</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data" id="attendanceForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" name="subject" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Branch</label>
                            <input type="text" name="branch" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <select name="course" class="form-control" id="courseSelect" required>
                                <option value="" disabled selected>Select Course</option>
                                <option value="BTech">BTech</option>
                                <option value="MCA">MCA</option>
                                <option value="MTech">MTech</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Semester</label>
                            <select name="semester" class="form-control" id="semesterSelect" required>
                                <option value="" disabled selected>Select Semester</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Class Photo</label>
                            <input type="file" name="class_photo" class="form-control" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            Take Attendance
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999;">
    <div class="d-flex justify-content-center align-items-center h-100">
        <div class="text-white text-center">
            <div class="spinner-border mb-2" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Processing attendance... Please wait.</p>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.getElementById('attendanceForm').addEventListener('submit', function() {
    document.getElementById('loadingOverlay').style.display = 'block';
    document.getElementById('submitBtn').disabled = true;
});

// Function to update semester dropdown based on selected course
document.getElementById('courseSelect').addEventListener('change', function() {
    let course = this.value;
    let semesterSelect = document.getElementById('semesterSelect');
    semesterSelect.innerHTML = '<option value="" disabled selected>Select Semester</option>'; // Reset options

    let semesters = [];
    if (course === 'BTech') {
        semesters = ['1-1', '1-2', '2-1', '2-2', '3-1', '3-2', '4-1', '4-2'];
    } else if (course === 'MCA' || course === 'MTech') {
        semesters = ['1-1', '1-2', '2-1', '2-2'];
    }

    semesters.forEach(sem => {
        let option = document.createElement('option');
        option.value = sem;
        option.textContent = sem;
        semesterSelect.appendChild(option);
    });
});
</script>
{% endblock %}
